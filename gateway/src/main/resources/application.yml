server:
  port: 8080
spring:
  application:
    name: shortlink-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: shortlink
    gateway:
      routes:
        - id: shortlink-project
          uri: lb://shortlink-project
          predicates:
            - Path=/s/**
        - id: shortlink-admin
          uri: lb://shortlink-admin
          predicates:
            - Path=/api/**

