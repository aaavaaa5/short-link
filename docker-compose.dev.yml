services:
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: shortlink_ds0
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - shortlink-mysql-data:/var/lib/mysql
      - ./resources/database/link.sql:/docker-entrypoint-initdb.d/01-link.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shortlink-net

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: shortlink-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - shortlink-nacos-data:/home/nacos/data
      - shortlink-nacos-logs:/home/nacos/logs
    networks:
      - shortlink-net

  web:
    image: nginx:1.27-alpine
    container_name: shortlink-web
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ../shortlink-fornt/dist:/usr/share/nginx/html:ro
      - ../shortlink-fornt/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shortlink-net

networks:
  shortlink-net:
    name: shortlink-net

volumes:
  shortlink-mysql-data:
    name: shortlink-mysql-data
  shortlink-nacos-data:
    name: shortlink-nacos-data
  shortlink-nacos-logs:
    name: shortlink-nacos-logs
