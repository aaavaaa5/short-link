server:
  port: 8083
spring:
  application:
    name:  shortlin-project
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: shortlink
      config:
        server-addr: 127.0.0.1:8848
        namespace: shortlink
  shardingsphere:
    datasource:
      names: ds0, ds1
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/shortlink_ds0
        username: root
        password:  ${DB_PASSWORD}
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/
        username: root
        password: ${DB_PASSWORD}
    rules:
      sharding:
        t_link:
          actual-data-nodes: ds$->{0..1}.t_link_$->{0..7}
          database-strategy:
            standard:
              sharding-column: gid
              sharding-algorithm-name: db-hash
          table-strategy:
            standard:
              sharding-column: gid
              sharding-algorithm-name: tbl-mod
        sharding-algorithms:
          db-hash:
            type: HASH_MOD
            props:
              sharding-count: 2
          tbl-mod:
            type: HASH_MOD
            props:
              sharding-count: 8
    props:
      sql-show: true
  data:
    redis:
      host: localhost
      port: 6379

# ==================== 布隆过滤器配置 ====================
# 基于 Redis Bitmap，用于防缓存穿透
shortlink:
  bloom-filter:
    # Bitmap 大小（bits），默认 2^25 ≈ 4 MB，误判率约 0.1%
    size: 33554432
    # 哈希函数数量
    hash-count: 3
    # 哈希加盐值
    salt: default
    # Redis Key 前缀
    key: shortlink:bf:short_uri

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs