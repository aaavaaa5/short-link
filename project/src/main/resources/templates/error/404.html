<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 短链接不存在</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .error-card {
            background: white; border-radius: 16px; padding: 48px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center; max-width: 480px;
        }
        .error-code { font-size: 72px; font-weight: 700; color: #e0e0e0; }
        .error-icon { font-size: 48px; margin: 16px 0; }
        h1 { font-size: 20px; color: #333; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; line-height: 1.6; }
        .back-link {
            display: inline-block; margin-top: 24px;
            padding: 10px 24px; background: #1677ff; color: white;
            border-radius: 8px; text-decoration: none; font-size: 14px;
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code">404</div>
    <div class="error-icon">🔗</div>
    <h1 th:text="${message}">短链接不存在</h1>
    <p>请检查链接是否正确，或联系管理员确认该短链接是否已被删除。</p>
    <a href="/" class="back-link">返回首页</a>
</div>
</body>
</html>
