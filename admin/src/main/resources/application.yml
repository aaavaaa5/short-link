server:
  port: 8081
spring:
  application:
    name: shortlink-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: shortlink
      config:
        server-addr: 127.0.0.1:8848
        namespace: shortlink
    # ==================== Sentinel 限流 ====================
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8080    # Sentinel Dashboard（可选）
      eager: true                    # 启动时立即初始化
  shardingsphere:
    mode:
      type: Memory
    datasource:
      names: ds0, ds1
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/shortlink_ds0
        username: root
        password: 123456
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/shortlink_ds1
        username: root
        password: 123456
    rules:
      sharding:
        t_link:
          actual-data-nodes: ds$->{0..1}.t_link_$->{0..7}
          database-strategy:
            standard:
              sharding-column: gid
              sharding-algorithm-name: db-hash
          table-strategy:
            standard:
              sharding-column: gid
              sharding-algorithm-name: tbl-mod
        sharding-algorithms:
          db-hash:
            type: HASH_MOD
            props:
              sharding-count: 2
          tbl-mod:
            type: HASH_MOD
            props:
              sharding-count: 8
    props:
      sql-show: true
  data:
    redis:
      host: localhost
      port: 6379

# ==================== 短链接配置 ====================
shortlink:
  # 短链接域名前缀（生成完整短链接时拼接，指向 Gateway）
  domain: http://localhost:9000/s
  # ==================== 布隆过滤器 ====================
  # 必须与 project 模块配置完全一致：两个服务操作的是同一个 Redis 位图，
  # 参数一旦不一致，会出现"admin 写入的位置 project 查不到"，过滤器静默失效
  bloom-filter:
    # Bitmap 大小（bits），默认 2^25 ≈ 4 MB
    size: 33554432
    # 哈希函数数量
    hash-count: 3
    # 哈希加盐值
    salt: default
    # Redis Key（与 project 保持一致）
    key: shortlink:bf:short_uri
  # JWT 配置
  jwt:
    # Token 有效期（小时）
    expire-hours: 24
    # 签名密钥（至少 256 位，生产环境必须修改）
    secret: shortlink-admin-secret-key-min-256-bits!!
